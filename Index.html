<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #header { padding: 10px; background: #1a202c; color: white; text-align: center; font-size: 16px; font-weight: bold; }
    #map { height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="header">Live Bus Location Tracker</div>
  <div id="map"></div>

  <script>
    let map = L.map('map').setView([28.4744, 77.5040], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let busMarker = null;
    let client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "passenger_" + Math.random());

    client.onMessageArrived = function(message) {
      let data = JSON.parse(message.payloadString);
      if (!busMarker) {
        busMarker = L.marker([data.lat, data.lng]).addTo(map).bindPopup("Bus 101 - In Transit").openPopup();
      } else {
        busMarker.setLatLng([data.lat, data.lng]);
      }
      map.panTo([data.lat, data.lng]);
    };

    client.connect({onSuccess: function() {
      client.subscribe("gbu_bus_location_demo_101");
    }});
  </script>
</body>
</html>
