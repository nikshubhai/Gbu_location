<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background: #f8f9fa;">
  <h2>Bus Driver App</h2>
  <p>Route: Mayur Vihar Ph 3 ➔ GBU Campus</p>
  <button id="btn" onclick="toggleTracking()" style="padding: 18px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold;">
    Start Sharing Location
  </button>
  <p id="status" style="margin-top: 20px; color: #555;">Status: Ready</p>

  <script>
    let tracking = false, watchId = null;
    let client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "driver_" + Math.random());
    client.connect({onSuccess: function() { console.log("Connected"); }});

    function toggleTracking() {
      if(!tracking) {
        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition(sendPos, function(err){ alert("GPS Error: " + err.message); }, { enableHighAccuracy: true });
          tracking = true;
          document.getElementById("btn").innerText = "Stop Sharing Location";
          document.getElementById("btn").style.background = "#dc3545";
          document.getElementById("status").innerText = "Status: Sharing Live GPS...";
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        tracking = false;
        document.getElementById("btn").innerText = "Start Sharing Location";
        document.getElementById("btn").style.background = "#28a745";
        document.getElementById("status").innerText = "Status: Stopped";
      }
    }

    function sendPos(pos) {
      let payload = JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      let message = new Paho.MQTT.Message(payload);
      message.destinationName = "gbu_bus_location_demo_101";
      client.send(message);
      document.getElementById("status").innerText = "Last Sent: " + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
